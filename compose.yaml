services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: /api
      BACKEND_BASE_URL: http://host.docker.internal:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - proxy
      - app
    depends_on:
      - backend

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/wol.db
    volumes:
      - wol_data:/data
    network_mode: host

networks:
  proxy:
    external: true
    name: proxy
  app:
    internal: true

volumes:
  wol_data:
